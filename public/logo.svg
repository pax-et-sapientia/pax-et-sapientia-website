<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1A2B4C" stroke-width="8"/>
  
  <!-- Open Book (Sapientia) -->
  <path d="M100 140 C 100 140, 70 140, 50 120 L 50 60 C 70 80, 100 80, 100 80 L 100 140 Z" fill="#C5A059" stroke="#1A2B4C" stroke-width="2"/>
  <path d="M100 140 C 100 140, 130 140, 150 120 L 150 60 C 130 80, 100 80, 100 80 L 100 140 Z" fill="#C5A059" stroke="#1A2B4C" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="140" stroke="#1A2B4C" stroke-width="2"/>
  
  <!-- Olive Branch (Pax) -->
  <g transform="translate(40, 150) rotate(-30)">
    <path d="M0 0 C 10 -10, 30 -10, 40 0" fill="none" stroke="#1A2B4C" stroke-width="2"/>
    <ellipse cx="10" cy="-8" rx="4" ry="2" fill="#708090" transform="rotate(-15, 10, -8)"/>
    <ellipse cx="20" cy="-10" rx="4" ry="2" fill="#708090" transform="rotate(-10, 20, -10)"/>
    <ellipse cx="30" cy="-8" rx="4" ry="2" fill="#708090" transform="rotate(5, 30, -8)"/>
  </g>
  <g transform="translate(160, 150) scale(-1, 1) rotate(-30)">
    <path d="M0 0 C 10 -10, 30 -10, 40 0" fill="none" stroke="#1A2B4C" stroke-width="2"/>
    <ellipse cx="10" cy="-8" rx="4" ry="2" fill="#708090" transform="rotate(-15, 10, -8)"/>
    <ellipse cx="20" cy="-10" rx="4" ry="2" fill="#708090" transform="rotate(-10, 20, -10)"/>
    <ellipse cx="30" cy="-8" rx="4" ry="2" fill="#708090" transform="rotate(5, 30, -8)"/>
  </g>
  
  <!-- Text along the arc -->
  <defs>
    <path id="textArc" d="M 30, 100 A 70, 70 0 1, 1 170, 100" />
  </defs>
  <text font-family="Serif" font-size="14" fill="#1A2B4C">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      PAX ET SAPIENTIA
    </textPath>
  </text>
</svg>