<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Closed Book (Sapientia) - Re-centered -->
  <g transform="translate(65, 55)">
    <!-- Book Binding (Spine) -->
    <path d="M0 0 L0 80 Q5 85 10 80 L10 0 Q5 -5 0 0" fill="#1A2B4C" stroke="#C5A059" stroke-width="1.5"/>
    
    <!-- Front Cover -->
    <path d="M10 0 L70 10 L70 90 L10 80 Z" fill="#1A2B4C" stroke="#C5A059" stroke-width="1.5"/>
    
    <!-- Page Edges (Bottom and Right) -->
    <path d="M10 80 L70 90 L75 85 L15 75 Z" fill="#FFFFFF" stroke="#1A2B4C" stroke-width="1"/>
    <path d="M70 10 L75 5 L75 85 L70 90 Z" fill="#FFFFFF" stroke="#1A2B4C" stroke-width="1"/>
    
    <!-- Page lines signifying multiple pages -->
    <g stroke="#1A2B4C" stroke-width="0.5" opacity="0.4">
      <line x1="71" y1="15" x2="74" y2="12"/>
      <line x1="71" y1="25" x2="74" y2="22"/>
      <line x1="71" y1="35" x2="74" y2="32"/>
      <line x1="71" y1="45" x2="74" y2="42"/>
      <line x1="71" y1="55" x2="74" y2="52"/>
      <line x1="71" y1="65" x2="74" y2="62"/>
      <line x1="71" y1="75" x2="74" y2="72"/>
      <line x1="71" y1="85" x2="74" y2="82"/>
    </g>

    <!-- Decorative Gold detail on cover -->
    <path d="M55 15 L70 16.5 L70 30 Z" fill="#C5A059"/>
  </g>

  <!-- Large, Distinct Olive Branch (Pax) crossing the front -->
  <g transform="translate(60, 120) rotate(-15)">
    <!-- Main Stem -->
    <path d="M0 0 Q40 -20 90 -10" fill="none" stroke="#C5A059" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Highly distinct Olive Leaves -->
    <path d="M15 -5 Q5 -25 25 -15 Q30 -5 15 -5" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M40 -12 Q35 -35 55 -25 Q55 -10 40 -12" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M30 -8 Q45 15 60 5 Q50 -5 30 -8" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M65 -12 Q85 10 95 0 Q80 -10 65 -12" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M90 -10 Q115 -15 110 5 Q95 5 90 -10" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>

    <!-- Prominent Olives -->
    <circle cx="25" cy="-5" r="5" fill="#C5A059" stroke="#1A2B4C" stroke-width="0.8"/> 
    <circle cx="55" cy="-10" r="5" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="0.8"/> 
    <circle cx="85" cy="0" r="5" fill="#C5A059" stroke="#1A2B4C" stroke-width="0.8"/>
  </g>
</svg>