<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Closed Book (Sapientia) -->
  <g transform="translate(60, 45)">
    <!-- Book Spine/Binding -->
    <path d="M0 5 L0 95 Q5 102 12 95 L12 5 Q5 -2 0 5" fill="#1A2B4C" stroke="#C5A059" stroke-width="2"/>
    
    <!-- Front Cover - Darker Blue with Light Outline -->
    <path d="M12 5 L85 15 L85 105 L12 95 Z" fill="#121F36" stroke="#C5A059" stroke-width="2"/>
    
    <!-- Page Edges (showing depth) -->
    <path d="M12 95 L85 105 L95 100 L22 90 Z" fill="#FFFFFF" stroke="#C5A059" stroke-width="1"/>
    <path d="M85 15 L95 10 L95 100 L85 105 Z" fill="#FFFFFF" stroke="#C5A059" stroke-width="1"/>
    
    <!-- Gold corner detail on cover -->
    <path d="M70 18 L85 20 L85 35 Z" fill="#C5A059"/>
  </g>

  <!-- Upward-pointing Olive Branch (Pax) crossing the front -->
  <g transform="translate(45, 155)">
    <!-- Main Stem - Sweeping upwards -->
    <path d="M0 0 Q20 -5 50 -40 Q80 -75 120 -90" fill="none" stroke="#C5A059" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Upward leaves - Lanceolate and distinct -->
    <!-- Base leaves -->
    <path d="M25 -12 Q10 -35 35 -30 Q45 -15 25 -12" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M40 -25 Q60 -5 75 -25 Q55 -45 40 -25" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    
    <!-- Mid-level leaves -->
    <path d="M65 -50 Q55 -75 80 -65 Q85 -45 65 -50" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M85 -60 Q110 -40 120 -60 Q105 -80 85 -60" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    
    <!-- Tip leaves -->
    <path d="M105 -85 Q100 -110 125 -105 Q135 -85 105 -85" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>
    <path d="M115 -88 Q145 -85 140 -105 Q125 -115 115 -88" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="1.2"/>

    <!-- Prominent Olives -->
    <circle cx="35" cy="-25" r="5.5" fill="#C5A059" stroke="#1A2B4C" stroke-width="0.8"/>
    <circle cx="80" cy="-60" r="5.5" fill="#f0f4f8" stroke="#1A2B4C" stroke-width="0.8"/>
    <circle cx="115" cy="-85" r="5.5" fill="#C5A059" stroke="#1A2B4C" stroke-width="0.8"/>
  </g>
</svg>